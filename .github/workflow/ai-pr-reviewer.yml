name: AI PR Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai_review:
    if: ${{ github.event.pull_request.draft == false && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest

    steps:
      - name: Request Copilot review
        id: request_copilot
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;

            // GitHub can expose Copilot reviewer under different handles.
            const candidates = ["copilot", "github-copilot[bot]", "copilot-swe-agent"];

            let requestedHandle = null;
            let lastError = null;

            for (const handle of candidates) {
              try {
                await github.rest.pulls.requestReviewers({
                  owner,
                  repo,
                  pull_number,
                  reviewers: [handle],
                });
                requestedHandle = handle;
                core.info(`Requested review from ${handle}`);
                break;
              } catch (error) {
                lastError = error;
                core.info(`Could not request ${handle}: ${error.message}`);
              }
            }

            if (requestedHandle) {
              core.setOutput("status", "requested");
              core.setOutput("handle", requestedHandle);
            } else {
              core.setOutput("status", "unavailable");
              core.setOutput("handle", "");
              core.warning(`Copilot auto-reviewer not available for this repo/plan. Last error: ${lastError?.message ?? "unknown"}`);
            }

      - name: Build status comment
        run: |
          if [ "${{ steps.request_copilot.outputs.status }}" = "requested" ]; then
            cat > review.md << 'EOF'
          AI PR reviewer is enabled for this PR.

          Copilot reviewer was automatically requested and should review code like a human reviewer with comments and suggestions.
          EOF
          else
            cat > review.md << 'EOF'
          AI PR reviewer workflow ran, but Copilot auto-review could not be requested with the current repository setup.

          Why this happens:
          - Copilot Pro is tied to your interactive account usage.
          - GitHub Actions jobs run with GITHUB_TOKEN, not your personal Copilot session.
          - Automated Copilot PR review requires GitHub's repository-level Copilot review feature availability.

          What to do:
          1. Enable Copilot code review feature for this repo in GitHub settings (if available).
          2. Re-run this workflow or push a new commit to retrigger it.
          EOF
          fi

      - name: Upsert PR review status comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ai-pr-reviewer
          path: review.md
